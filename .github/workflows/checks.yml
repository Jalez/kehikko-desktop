# Pull request checks. Read-only, no secrets.
#
# release-note: the description's "## Release note" section, the line the app's
# release page will carry (or `none`); the same check the host runs, with the
# host's module-agnostic list from its main. Editing the description re-runs it.
# release-scripts is its own workflow (release-scripts.yml): this one also runs
# when a description is edited, and a job skipped on that event left a SKIPPED
# release-scripts check-run beside the real one.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  release-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Jalez/kehikko
          path: host
          persist-credentials: false
          sparse-checkout: |
            dev
            modules.json
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/release-note
        with:
          body: ${{ github.event.pull_request.body }}
          host-dir: host
