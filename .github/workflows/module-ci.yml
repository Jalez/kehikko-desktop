# Check a Kehikot module on every pull request: the workflow every module
# repository calls from its own .github/workflows/ci.yml. On a pull request it
# first checks that a version bump matches the kind of change notes/<version>.md
# declares (semver; .github/actions/version-kind). Then it installs, typechecks,
# tests, holds an agent module to the shared conformance (kehikot-check-agent,
# protocol 2.95.0) and builds, skipping whatever the module does not have.
#
# The caller, in the module repository:
#
#   name: ci
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: Jalez/kehikko-desktop/.github/workflows/module-ci.yml@main
#
# Inputs (all optional): `runners` is a JSON list of runners, ubuntu only by
# default (`'["ubuntu-latest","macos-latest"]'` for both); `env` is extra
# environment for the test and build steps, one NAME=value per line (`CI=1`);
# `bun-version` matches module-release. A private repository of another owner
# cannot call this file; it keeps an inline copy of these steps instead.
name: module-ci

on:
  workflow_call:
    inputs:
      runners:
        description: A JSON list of runners to run on.
        type: string
        default: '["ubuntu-latest"]'
      env:
        description: Extra environment for the typecheck, test and build steps, one NAME=value per line.
        type: string
        default: ""
      bun-version:
        type: string
        default: latest

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A version bump says its kind: notes/<version>.md starts with
      # `Kind: breaking | feature | fix`, and the version is the one that kind
      # asks for after the latest tag (0.x: breaking → minor, otherwise patch;
      # from 1.0: breaking → major, feature → minor, fix → patch).
      - name: The version matches its kind
        if: github.event_name == 'pull_request'
        uses: Jalez/kehikko-desktop/.github/actions/version-kind@main

      # The notes a new version brings pass the same gate the release holds
      # them to (actions/notes-gate), so a note the release would refuse fails
      # here, before the merge, not in the release after it.
      - name: The release notes say what changed
        if: github.event_name == 'pull_request'
        uses: Jalez/kehikko-desktop/.github/actions/notes-gate@main
        with:
          only-new: "true"

      # Release order, as a warning only: the app may be released before this
      # pull request merges. The release itself refuses (module-release.yml).
      - name: The app already speaks the module's protocol
        if: github.event_name == 'pull_request' && matrix.os == fromJSON(inputs.runners)[0]
        continue-on-error: true
        uses: Jalez/kehikko-desktop/.github/actions/protocol-order@main
        with:
          mode: warn

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # Extra environment for the steps below.
      - name: Set the extra environment
        if: inputs.env != ''
        env:
          EXTRA_ENV: ${{ inputs.env }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<<"$EXTRA_ENV"

      # Modules depend on the public protocol through git+ssh URLs; a runner has
      # no SSH key, so fetch GitHub over https.
      - name: Fetch GitHub dependencies over https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        shell: bash
        run: |
          if jq -e '.scripts.typecheck' package.json >/dev/null 2>&1; then
            bun run typecheck
          elif [ -f tsconfig.json ]; then
            bunx tsc --noEmit
          else
            echo "No typecheck script and no tsconfig.json; skipped."
          fi

      # A module's tests start through the protocol's shared preload
      # (`import 'kehikot-module-protocol/testing/setup'` in a file bunfig.toml
      # preloads), so no test can reach the running app through the KEHIKOT_*
      # variables a session leaks (it once did, at :4170). A new module that
      # forgets it fails here instead of in somebody's app. A module with no
      # tests has nothing to check.
      - name: Tests use the shared test preload
        shell: bash
        run: |
          if [ -z "$(find . -path ./node_modules -prune -o \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.js' \) -print -quit)" ]; then
            echo "No tests; nothing to check."
            exit 0
          fi
          files=$(sed -n '/^\[test\]/,/^\[/p' bunfig.toml 2>/dev/null | grep -E '^[[:space:]]*preload' | grep -oE '"[^"]+"' | tr -d '"')
          for file in $files; do
            if [ -f "$file" ] && grep -qE "kehikot-module-protocol/testing/setup" "$file"; then
              echo "$file imports the shared test preload."
              exit 0
            fi
          done
          echo "::error::This module's tests do not start through the shared preload. Add \`import 'kehikot-module-protocol/testing/setup'\` as the first line of a file bunfig.toml preloads under [test] (pin kehikot-module-protocol v2.104.0 or newer). It drops the running app's KEHIKOT_* environment so no test reaches the person's app."
          exit 1

      - name: Test
        run: bun test

      # An agent module's door config names only the starting host's stable
      # door (protocol 2.95.0): every session door at `<host>/m/<id>/mcp` on the
      # host that started the module, never a module's raw port, which changes
      # on the next restart and leaves the session reconnecting to nothing.
      # `kehikot-check-door-config` comes with the module's own protocol; a
      # module whose protocol predates it is warned, not failed, and a module
      # that writes no agent door config passes.
      - name: Door config names only the starting host's stable door
        shell: bash
        run: |
          check=node_modules/kehikot-module-protocol/bin/check-door-config.ts
          if [ -f "$check" ]; then
            bun "$check" .
          elif grep -rqsE --include='*.ts' --exclude-dir=node_modules --exclude-dir=test 'mcpServers|mcp_servers|--mcp-config' .; then
            echo "::warning::This module writes an agent door config, and its protocol is older than 2.95.0: pin kehikot-module-protocol to v2.95.0 or newer so the door config check runs."
          else
            echo "Writes no agent door config; nothing to check."
          fi

      # A page asks its own server through `ask`, `follow` or `subscribe`
      # (protocol 2.106.0 resolves `./api/...` against the module's origin
      # root). A raw `fetch('./api/...')` or `new EventSource('./api/...')`
      # resolves against the path the host frames the page at, and silently
      # reaches nothing at `/app/` or `/app/?...`. `kehikot-check-addresses`
      # comes with the module's own protocol; a module whose protocol predates
      # it has nothing to run yet.
      - name: No raw relative address to the module's own server
        shell: bash
        run: |
          check=node_modules/kehikot-module-protocol/bin/check-addresses.ts
          if [ -f "$check" ]; then
            bun "$check" .
          else
            echo "The module's protocol is older than 2.106.0; nothing to run."
          fi

      # An agent module — one whose manifest asks for agents:message — is built so
      # every conversation can message, however it started (protocol 2.95.0):
      # it provides agent.delivery, lists every tool to a caller with no place
      # token, and has a test that runs the shared conformance
      # (kehikot-module-protocol/testing), which `bun test` above ran.
      # A module on an older protocol is warned, not failed, until the agent
      # modules have moved.
      - name: Agent modules meet the conformance
        shell: bash
        run: |
          check=node_modules/kehikot-module-protocol/bin/check-agent.ts
          version=$(jq -r .version node_modules/kehikot-module-protocol/package.json 2>/dev/null || echo 0)
          if [ -f "$check" ] && [ "$(printf '%s\n2.108.2\n' "$version" | sort -V | head -1)" = 2.108.2 ]; then
            bun "$check" .
          elif [ -f "$check" ]; then
            # Before 2.108.2 the check took every module asking for agents:message
            # to be an agent module, so one that only sends sessions a note
            # failed it. Said, not failed, until it pins
            # 2.108.2 or newer.
            bun "$check" . || echo "::warning::The agent check of protocol $version misjudges a module that only sends messages. Pin kehikot-module-protocol 2.108.2 or newer to run the check that counts."
          elif grep -rqs "agents:message" manifest.ts manifest.js manifest.mjs; then
            echo "::warning::This module messages (agents:message) and its protocol is older than 2.95.0, so the agent conformance check cannot run. Pin kehikot-module-protocol 2.95.0 or newer and add the conformance test."
          else
            echo "Not an agent module, or a protocol older than the check; skipped."
          fi

      - name: Build
        shell: bash
        run: |
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            bun run build
          else
            echo "No build script; skipped."
          fi
