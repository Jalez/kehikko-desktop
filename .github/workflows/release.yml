# Build Kehikot for macOS (Apple Silicon + Intel) with the host bundled, sign the
# updater archives, and publish a GitHub Release with latest.json -- the file
# every installed copy checks on launch.
#
# Releases are cut automatically: auto-release.yml tags the next version on
# main and calls this workflow with the tag, the host commit and the notes (see
# CLAUDE.md, "Releases are automatic"). The version is the TAG's: it is stamped
# into tauri.conf.json, Cargo.toml and package.json at build time, and the
# version in those files is not bumped by hand.
#
# It still runs on a vX.Y.Z tag pushed by the owner (with notes/<version>.md
# committed), and by hand on a tag ref (workflow_dispatch) to rebuild a release
# whose build failed; the notes and the host commit then come from the tag's
# message when they are not in the repository. Never on a branch, a pull
# request or a fork. See docs/README.md, "Releases and updates".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag to build; it already exists, on a commit of main.
        type: string
        required: true
      host_sha:
        description: The Jalez/kehikko commit to bundle.
        type: string
        required: true
      notes:
        description: The bullets of "What's new".
        type: string
        required: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      HOST_TAG_TOKEN:
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # One draft release up front, so both architectures upload into the same one.
  draft:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.version.outputs.tag }}
      host_sha: ${{ steps.host.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # Only a vX.Y.Z tag on a commit of main is built.
      - name: Read the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ -z "$INPUT_TAG" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Run this on a tag (vX.Y.Z), not on ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$tag is not vX.Y.Z."
            exit 1
          fi
          commit="$(git rev-parse "$tag^{commit}")"
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$tag points at $commit, which is not on main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The host commit: the one auto-release planned with, else the one the
      # tag's message names ("Kehikot-Host: Jalez/kehikko@<sha>"), else host.ref,
      # a branch, tag or commit of Jalez/kehikko. It is resolved to one commit
      # here, once, so both architectures bundle the same host and the release
      # can say exactly which.
      - name: Resolve the host commit
        id: host
        env:
          INPUT_HOST_SHA: ${{ inputs.host_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          said="$(git tag -l --format='%(contents)' "$TAG" | sed -n 's/^Kehikot-Host: Jalez\/kehikko@\([0-9a-f]\{40\}\)$/\1/p' | tail -n1)"
          ref="${INPUT_HOST_SHA:-${said:-$(tr -d '[:space:]' < host.ref)}}"
          if printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$ref"
          else
            sha="$(git ls-remote https://github.com/Jalez/kehikko.git "$ref" "refs/tags/$ref^{}" | awk 'NR==1{print $1}')"
          fi
          [ -n "$sha" ] || { echo "::error::host.ref '$ref' does not resolve in Jalez/kehikko"; exit 1; }
          echo "Host: Jalez/kehikko@$sha (from host.ref '$ref')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A release says what changed, in words a person cares about, or it is not
      # cut. The notes are auto-release's (from the merged pull requests' Release
      # note lines), or notes/<version>.md committed with a hand release, or the
      # tag's message when rebuilding; the gate (dev/release/notes-gate.sh, rules
      # in CLAUDE.md) is the same for all three. The app's release-notes modal
      # shows exactly this section.
      - name: Read the release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          version="${TAG#v}"
          file="notes/${version}.md"
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > "$file"
          elif [ ! -f "$file" ]; then
            git tag -l --format='%(contents)' "$TAG" | grep -v '^Kehikot-Host: ' > "$file" || true
          fi
          body="$(bash dev/release/notes-gate.sh "$file" "$version")"
          {
            echo 'whats_new<<KEHIKOT_NOTES_END'
            printf '%s\n' "$body"
            echo 'KEHIKOT_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          HOST_SHA: ${{ steps.host.outputs.sha }}
          WHATS_NEW: ${{ steps.notes.outputs.whats_new }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            version="${TAG#v}"
            notes="### What's new
          ${WHATS_NEW}

          <sub>Built from [Jalez/kehikko@${HOST_SHA:0:7}](https://github.com/Jalez/kehikko/commit/$HOST_SHA).</sub>"
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Kehikot $TAG" --notes "$notes"
          fi
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: true
      # One at a time: each job reads, merges and re-uploads latest.json, and two
      # at once can overwrite each other's platform entry.
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
          - target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.tag }}

      - uses: actions/checkout@v4
        with:
          repository: Jalez/kehikko
          ref: ${{ needs.draft.outputs.host_sha }}
          path: kehikko

      # Pinned, never "latest": this Bun is compiled into the host and installs every module
      # (`bun install --frozen-lockfile`), so a newer one that reads the modules' lockfiles
      # differently would break installs with no change of ours. Raise it on purpose, after a
      # frozen install of each module's latest release passes with the new version.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # kehikko depends on the public protocol through git+ssh URLs; a runner
      # has no SSH key, and the repository is public, so fetch it over https.
      - name: Fetch GitHub dependencies over https
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Build the bundled host
        working-directory: kehikko
        run: |
          bun install
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          bun run build:sidecar --target ${{ matrix.bun_target }} \
            --out "$GITHUB_WORKSPACE/src-tauri/binaries/kehikko-host-${{ matrix.target }}"

      - name: Install the Tauri CLI
        run: npm ci

      # The version is the tag's. The files in the repository are not bumped per
      # release; the app, its updater entry and the bundle all read these.
      - name: Stamp the version
        env:
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          version="${TAG#v}"
          for f in src-tauri/tauri.conf.json package.json; do
            jq --arg v "$version" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          V="$version" perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{V}"/m' src-tauri/Cargo.toml
          V="$version" perl -0pi -e 's/(name = "kehikko-desktop"\nversion = )"[^"]*"/$1"$ENV{V}"/' src-tauri/Cargo.lock
          [ "$(jq -r .version src-tauri/tauri.conf.json)" = "$version" ] &&
            grep -q "^version = \"$version\"" src-tauri/Cargo.toml &&
            grep -A1 '^name = "kehikko-desktop"$' src-tauri/Cargo.lock | grep -q "^version = \"$version\"" ||
            { echo "::error::Could not stamp $version into the version files."; exit 1; }
          echo "Building Kehikot $version"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing + notarization (Developer ID). See docs/README.md,
          # "Apple signing and notarization", for how these secrets are made.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundled.conf.json

      # Tauri notarizes and staples the app; the disk image around it is signed
      # but not notarized. Notarize and staple it too, and replace the uploaded
      # one, so even a strict Gatekeeper check of the .dmg itself passes.
      - name: Notarize and staple the disk image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 2h
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          gh release upload "$TAG" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"

  # Published only when both architectures are in, so latest.json never points
  # an Intel Mac at a release that has no Intel build.
  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Mark the host commit this release bundled as app-<tag> in Jalez/kehikko, so
      # its Tags page lists every app version. GITHUB_TOKEN cannot write to
      # another repository: this needs HOST_TAG_TOKEN, a fine-grained token with
      # Contents: read and write on Jalez/kehikko only. Without it the release
      # still publishes and this step says what to do.
      - name: Tag the host commit
        env:
          GH_TOKEN: ${{ secrets.HOST_TAG_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag }}
          HOST_SHA: ${{ needs.draft.outputs.host_sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOST_TAG_TOKEN is not set; tag Jalez/kehikko@$HOST_SHA as app-$TAG by hand (see the comment above this step)."
            exit 0
          fi
          if gh api "repos/Jalez/kehikko/git/ref/tags/app-$TAG" >/dev/null 2>&1; then
            echo "app-$TAG already exists in Jalez/kehikko"; exit 0
          fi
          obj="$(gh api repos/Jalez/kehikko/git/tags -f tag="app-$TAG" -f object="$HOST_SHA" -f type=commit \
            -f message="Host bundled in Kehikot $TAG
          https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" --jq .sha)"
          gh api repos/Jalez/kehikko/git/refs -f ref="refs/tags/app-$TAG" -f sha="$obj" >/dev/null
          echo "Tagged Jalez/kehikko@$HOST_SHA as app-$TAG"

