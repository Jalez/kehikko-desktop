<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kehikot</title>
    <!--
      The theme, applied before this page has painted a single frame.

      This used to be `color-scheme: light dark` with `background: Canvas`,
      which follows the OPERATING SYSTEM's appearance — and the person's choice
      about Kehikot is not a fact about their Mac. Somebody who runs this
      workbench dark on a light-mode machine got a white screen here on every
      launch, and then a black canvas a second later when the host's page
      arrived. Correct system-colour usage; wrong program.

      It cannot be read from where the host keeps it. The host decides the theme
      from a `kehikko.theme` cookie on `http://127.0.0.1:4181`, in a blocking
      script in its own `index.html`; this page is served at `tauri://localhost`,
      and a cookie on one origin is invisible to the other. So this page is
      TOLD: `src-tauri/src/theme.rs` injects an initialization script that puts
      the word on `window.__kehikkoDesktopTheme` before this document is parsed,
      the shell having read it from a file it wrote the last time the host said
      what it was showing.

      Dark unless told light — the same default the host has, and defended in
      the same place. Two defaults that disagree would not fix the flash, they
      would move it: white here for a beat, then black when the host's page
      loads. And when the shell has never been told anything (a first run), dark
      is what the host is about to show.

      The two colours are the host's `--background` at each end — `oklch(0 0 0)`
      and `oklch(1 0 0)` — stated inline for the reason the host's index.html
      states them inline: a class selects nothing until a stylesheet says what
      it means, and this is the whole screen. `theme.rs` holds them a third time
      as the window's own colour, because AppKit does not read stylesheets.
    -->
    <style>
      html {
        color-scheme: dark;
        background: oklch(0 0 0);
        color: oklch(0.92 0 0);
      }
      html.light {
        color-scheme: light;
        background: oklch(1 0 0);
        color: oklch(0.2 0 0);
      }
      :root {
        --ink: currentColor;
      }
      html, body {
        height: 100%;
        margin: 0;
        font: 15px/1.6 ui-sans-serif, -apple-system, system-ui, sans-serif;
        background: inherit;
        color: inherit;
      }
      main {
        height: 100%;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.75rem;
        padding: 2rem;
        text-align: center;
      }
      .words { max-width: 34rem; }
      h1 {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0 0 0.35rem;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        font-size: 0.8rem;
        opacity: 0.62;
        overflow-wrap: anywhere;
      }

      /*
       * A frame drawing itself.
       *
       * `kehikko` is Finnish for a frame, and a wireframe cube is one — so the
       * mark is the word. It starts as a single horizontal line, the front face
       * grows out of it, the back face follows, and the struts join them: a line
       * becoming a frame becoming a solid, which is also what the app does to a
       * folder.
       *
       * Drawn with `stroke-dashoffset` rather than with opacity, because a line
       * that fades in has no direction and a line that draws has one. Each group
       * has its own delay, so the order reads as construction rather than as
       * twelve things appearing at once.
       *
       * `currentColor` throughout: one mark, correct in light and dark, no
       * second asset and nothing to keep in step.
       */
      .mark { width: 108px; height: 108px; color: var(--ink); }
      .mark path, .mark line { stroke: currentColor; stroke-width: 1.25; fill: none; stroke-linecap: square; }

      .seed, .front, .back, .strut { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); }
      .seed { --len: 56; animation: draw 0.42s ease-out 0.05s forwards; }
      .front { --len: 224; animation: draw 0.75s ease-out 0.42s forwards; }
      .back { --len: 224; animation: draw 0.75s ease-out 0.95s forwards; }
      .strut { --len: 40; animation: draw 0.4s ease-out var(--at) forwards; }
      .s1 { --at: 1.5s; } .s2 { --at: 1.6s; } .s3 { --at: 1.7s; } .s4 { --at: 1.8s; }

      @keyframes draw { to { stroke-dashoffset: 0; } }

      /* Once it is built, it breathes — slowly, and only while waiting. It is a
         sign that something is still happening, not decoration. */
      .built { animation: breathe 3.4s ease-in-out 2.3s infinite; transform-origin: 54px 54px; }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }

      /* A host that failed is not still working, so the breathing stops and the
         mark goes quiet. Saying it twice — in the words and in the mark — is
         the point; somebody glancing at the window should not have to read. */
      body[data-phase='failed'] .built { animation: none; opacity: 0.32; }
      body[data-phase='failed'] h1 { color: color-mix(in oklab, currentColor 70%, red); }

      /* Somebody who asked for less movement gets the finished frame and no
         drawing, rather than a still frame of a half-built one. */
      @media (prefers-reduced-motion: reduce) {
        .seed, .front, .back, .strut { animation: none; stroke-dashoffset: 0; }
        .built { animation: none; }
      }
    </style>
    <!--
      A plain blocking script in the head, not a module and not at the end of
      the body, for the reason the host's page gives at length: a deferred
      script runs after the browser has already painted, and nothing further
      down can undo a frame that has been shown. The class lands on `<html>`
      before the body exists, and there is nothing left to correct.

      This READS what the shell decided. It does not decide anything — there is
      one decision about the theme in this whole system and it is the host's,
      made from its cookie; `theme.rs` explains what happens on the rare
      occasions the shell's copy of the answer has gone stale.
    -->
    <script>
      ;(function () {
        try {
          if (window.__kehikkoDesktopTheme === 'light') {
            document.documentElement.classList.add('light')
          }
        } catch (_) {
          /* Nothing was injected — this page opened in something that is not
             the shell. Dark, like everybody the host has not been told
             otherwise about. A theme is not worth an exception thrown before
             the window has said what it is doing. */
        }
      })()
    </script>
  </head>
  <body>
    <!--
      The waiting room.

      This is the only page this shell owns. It exists because starting the host
      takes a moment and, without it, that moment is a white window or no window
      at all, with the reason in a terminal nobody has open.

      It never frames anything and it never becomes the workbench. The moment
      the host answers, the window navigates to the host's own page and this
      document is gone.
    -->
    <main>
      <svg class="mark" viewBox="0 0 108 108" aria-hidden="true">
        <g class="built">
          <!-- The line everything grows from: the front face's bottom edge. -->
          <line class="seed" x1="26" y1="82" x2="82" y2="82" />

          <!-- The front face, drawn up and around from that line. -->
          <path class="front" d="M26 82 L26 26 L82 26 L82 82" />

          <!-- The back face, offset, drawn the same way. -->
          <path class="back" d="M46 62 L46 6 L102 6 L102 62 L46 62" />

          <!-- The four struts that make it a solid rather than two squares. -->
          <line class="strut s1" x1="26" y1="26" x2="46" y2="6" />
          <line class="strut s2" x1="82" y1="26" x2="102" y2="6" />
          <line class="strut s3" x1="82" y1="82" x2="102" y2="62" />
          <line class="strut s4" x1="26" y1="82" x2="46" y2="62" />
        </g>
      </svg>

      <div class="words">
        <h1 id="headline">Starting the host…</h1>
        <p id="detail">Looking for the workbench on 127.0.0.1:4181.</p>
      </div>
    </main>

    <script>
      // Called from Rust with `eval`. Text only — a path is set with
      // textContent, never innerHTML, so a folder with a bracket in its name is
      // a folder and not markup.
      window.kehikkoStatus = function (phase, message) {
        document.body.dataset.phase = phase;
        document.getElementById('headline').textContent = {
          starting: 'Starting the host…',
          adopted: 'A host was already running',
          failed: 'The workbench did not start',
        }[phase] || 'Kehikot';
        document.getElementById('detail').textContent = message;
      };
    </script>
  </body>
</html>
