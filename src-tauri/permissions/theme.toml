#  The one application command this shell has, made nameable.
#
#  Tauri v2 will not let a REMOTE origin reach an application command unless a
#  capability names it, and a capability can only name a permission — so a
#  command with no permission file is a command the host's page cannot call, and
#  the rejection says "Command not found" rather than anything about origins.
#  This file is the missing half.
#
#  It could have been autogenerated instead, by listing the command in
#  `build.rs` via `AppManifest::commands`, which writes an identical file into
#  `permissions/autogenerated/`. Hand-written for two reasons: it is one
#  permission and will stay one, and a generated file has nowhere to put the
#  paragraph above.
#
#  Defining any application permission turns on ACL checking for application
#  commands from local pages too, not only remote ones. That is fine here and
#  worth knowing: there is exactly one such command, the waiting room never
#  calls it, and a second one added later will need naming here or it will be
#  refused everywhere rather than silently allowed.

[[permission]]
identifier = "allow-remember-theme"
description = "Allows the host's page to tell the shell which theme it is showing, so the window can be built in that colour next time."
commands.allow = ["remember_theme"]
